[phases.setup]
nixPkgs = [
    "php83",
    "php83Packages.composer",
    "php83Extensions.pdo",
    "php83Extensions.pdo_mysql",
    "php83Extensions.mbstring",
    "php83Extensions.bcmath",
    "php83Extensions.curl"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction"
]

[start]
cmd = "sh -c 'php artisan config:clear && php artisan route:clear && php artisan migrate --force && php artisan resto:hostinger-cron && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'"
